<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Backstage">
<title>Backstage</title>
<style>
body{font-family:system-ui,sans-serif;max-width:650px;margin:auto;padding:18px;background:#111;color:#eee}
h1{font-size:1.5rem}
.card{background:#1d1d1d;border-radius:14px;padding:16px;margin:12px 0}
select,input,button{font:inherit;border-radius:10px;border:1px solid #444;padding:12px;background:#292929;color:#fff}
input{width:100%;box-sizing:border-box}
button{cursor:pointer;font-weight:600}
button:active{transform:scale(.98)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picks{display:flex;gap:6px;margin-bottom:10px}
.picks button{flex:1}
.picks button.on{border-color:#6a6;background:#1f331f}
.row{display:flex;gap:10px}
.row input{flex:1}
.wide{width:100%;margin-top:10px}
.empty,.note{color:#888}
.note{font-size:.9rem;margin:8px 0 0}
.log{font-family:ui-monospace,monospace;font-size:.85rem;color:#bbb;white-space:pre-wrap;margin:10px 0 0;max-height:240px;overflow-y:auto}
.status{position:sticky;bottom:0;min-height:24px;padding:12px 0;background:#111;color:#aaa}
</style>
</head>
<body>
<h1>🎭 Backstage</h1>

{% if voices %}
<div class="card">
<h3>Chat as</h3>
<div class="picks" id="voices">
{% for v in voices %}<button onclick="pickVoice(this)" data-voice="{{v}}">{{v}}</button>{% endfor %}
</div>
<form class="row" onsubmit="say(event)">
<input id="text" maxlength="200" autocomplete="off" enterkeyhint="send" placeholder="Message">
<button>Send</button>
</form>
<p class="note">Shows in chat exactly like a player talking.</p>
</div>
{% endif %}

<div class="card">
<h3>Events</h3>
<div id="events"><p class="empty">Loading…</p></div>
<div id="current"></div>
</div>

<div class="status" id="status"></div>

<script>
const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
// Same password handling as the main panel (shared localStorage key).
function token() {
  try { return localStorage.getItem('mcpanel-token') || ''; } catch (e) { return ''; }
}
async function api(url, opts = {}) {
  opts.headers = Object.assign({'X-API-Token': token()}, opts.headers);
  const r = await fetch(url, opts);
  if (r.status === 401) {
    const t = prompt('Panel password');
    if (t) {
      try { localStorage.setItem('mcpanel-token', t); } catch (e) {}
      return api(url, opts);
    }
  }
  return r.json();
}
async function call(url, body) {
  const d = await api(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  $('status').textContent = d.ok ? ('✓ ' + (d.output || 'Done')) : ('✗ ' + d.error);
  return d;
}

let voice = '';
function pickVoice(b) {
  voice = b.dataset.voice;
  document.querySelectorAll('#voices button').forEach(x => x.classList.toggle('on', x === b));
  try { localStorage.setItem('mcpanel-voice', voice); } catch (e) {}
}
async function say(ev) {
  ev.preventDefault();
  if (!voice) { $('status').textContent = '✗ Pick who is talking first'; return; }
  const d = await call('/api/say', {voice, text: $('text').value});
  if (d.ok) $('text').value = '';
  $('text').focus();
}

async function loadEvents() {
  const d = await api('/api/event');
  if (!d.ok) return;
  const box = $('events');
  box.textContent = '';
  if (!d.events.length) box.append(el('p', 'empty', 'No events set up.'));
  const running = d.current && d.current.running;
  const grid = el('div', 'grid');
  for (const e of d.events) {
    const b = el('button', '', '▶️ ' + e.label);
    b.disabled = running;
    b.onclick = async () => { await call('/api/event', {op:'start', id:e.id}); loadEvents(); };
    grid.append(b);
  }
  box.append(grid);

  const cur = $('current');
  cur.textContent = '';
  if (!d.current) return;
  const c = d.current;
  cur.append(el('p', 'note', running ? `Running: ${c.label}` : `${c.label} finished` + (c.exit ? ` (exit ${c.exit})` : '')));
  if (running && c.controls.length) {
    const g = el('div', 'grid');
    for (const k of c.controls) {
      const b = el('button', '', k.label);
      b.onclick = () => call('/api/event', {op:k.op});
      g.append(b);
    }
    cur.append(g);
  }
  const log = el('div', 'log', c.log.join('\n'));
  cur.append(log);
  log.scrollTop = log.scrollHeight;
}

try {
  const saved = localStorage.getItem('mcpanel-voice');
  const b = [...document.querySelectorAll('#voices button')].find(x => x.dataset.voice === saved);
  if (b) pickVoice(b);
} catch (e) {}
loadEvents();
setInterval(loadEvents, 3000);
</script>
</body>
</html>
